[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qd-attention"
version = "0.1.0"
description = "Standalone native CUDA Attention kernels targeting Qwen and DeepSeek"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
optimized = ["triton>=3.0"]
